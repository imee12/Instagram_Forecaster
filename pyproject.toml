[project]
name = "ig-forecaster"
version = "0.1.0"
description = "Refactored Instagram forecaster project"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "sentence-transformers",
  "transformers>=4.41,<5",
  "pydantic",
  "google-genai",
  "langsmith>=0.1.98",
  "langchain>=1.0",
  "langchain-google-genai>=4.0",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "pytrends==4.9.2",
  "streamlit>=1.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
