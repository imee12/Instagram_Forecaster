[project]
name = "ig-forecaster"
version = "0.1.0"
description = "Refactored Instagram forecaster project"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "sentence-transformers",
  "faiss-cpu",
  "pydantic",
  "google-genai",
  "langsmith>=0.1.98",
  "pytrends==4.9.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
